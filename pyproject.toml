[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"
[project]
name = "pyths"
version = "0.1.0.dev0"
description = "Experimental read-only Python SDK for observed THS mobile protocols"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.13"
dependencies = []
[project.optional-dependencies]
dev = ["hatchling==1.32.0", "build==1.6.0", "pytest==9.1.1", "ruff==0.16.6", "mypy==2.3.1"]
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]
[tool.mypy]
strict = true
[tool.ruff]
target-version = "py313"
